################
### MONITORS ###
################

monitor=,preferred,auto,1
monitor=HDMI-A-1,1920x1080@144,auto,1

########################
### WORKSPACES        ###
########################

# Portátil (eDP-1): workspaces 1-8
workspace = 1, monitor:eDP-1, persistent:true, default:true
workspace = 2, monitor:eDP-1, persistent:true
workspace = 3, monitor:eDP-1, persistent:true
workspace = 4, monitor:eDP-1, persistent:true
workspace = 5, monitor:eDP-1, persistent:true
workspace = 6, monitor:eDP-1, persistent:true
workspace = 7, monitor:eDP-1, persistent:true
workspace = 8, monitor:eDP-1, persistent:true

# HDMI (AOC): workspaces 9-11
workspace = 9,  monitor:HDMI-A-1, persistent:true, default:true
workspace = 10, monitor:HDMI-A-1, persistent:true
workspace = 11, monitor:HDMI-A-1, persistent:true

#################
### AUTOSTART ###
#################

# Waybar runs as a systemd --user unit, not as a bare exec-once, so that it is
# supervised: exec-once starts a process and forgets it, so the one time the bar
# died (SIGBUS under global memory pressure) it stayed dead for hours. See
# ~/.config/systemd/user/waybar.service.
# The import-environment keeps HYPRLAND_INSTANCE_SIGNATURE fresh in the systemd
# environment across compositor restarts -- the bar's on-click handlers shell
# out to hyprctl, which talks to whichever instance that signature names.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP && systemctl --user restart waybar.service
exec-once = mako
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = swaybg -i /home/lameiro0x/Pictures/wallpapers/manos.png -m fill

#######################
### ENVIRONMENT VARS ###
#######################

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(888888)
    col.inactive_border = rgb(333333)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 4
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.05
        vibrancy_darkness = 0.1
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = snap, 0.25, 1, 0.5, 1
    animation = windows, 1, 3, snap
    animation = windowsOut, 1, 3, default, popin 80%
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, snap, slide
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

#############
### INPUT ###
#############

input {
    kb_layout = es
    kb_options = ctrl:nocaps
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

###################
### KEYBINDINGS ###
###################

$mod = SUPER

# ── WM utilities (kept on SUPER) ─────────────────────────────────────────────
bind = $mod SHIFT, E,  exit
bind = $mod, F,        fullscreen
bind = $mod, V,        togglefloating
bind = $mod, P,        pseudo
bind = $mod, J,        layoutmsg, togglesplit

# ── Terminal ──────────────────────────────────────────────────────────────────
bind = CTRL, Return, exec, kitty

# ── Close window ─────────────────────────────────────────────────────────────
bind = CTRL, Q, killactive

# ── Launcher ─────────────────────────────────────────────────────────────────
bind = CTRL, Space, exec, rofi -show drun -theme ~/.config/rofi/style.rasi

# ── Focus (CTRL + hjkl) ──────────────────────────────────────────────────────
bind = CTRL, h, movefocus, l
bind = CTRL, l, movefocus, r
bind = CTRL, k, movefocus, u
bind = CTRL, j, movefocus, d

# ── Cambiar foco entre monitores / mover ventana entre monitores ─────────────
bind = CTRL, Tab,       focusmonitor, +1
bind = CTRL SHIFT, Tab, movewindow,   mon:+1

# ── Move/swap windows (CTRL + SUPER + hjkl) ───────────────────────────────────
bind = CTRL SUPER, h, movewindow, l
bind = CTRL SUPER, l, movewindow, r
bind = CTRL SUPER, k, movewindow, u
bind = CTRL SUPER, j, movewindow, d

# ── Resize windows (CTRL + SHIFT + hjkl) ─────────────────────────────────────
bind = CTRL SHIFT, h, resizeactive, -40 0
bind = CTRL SHIFT, l, resizeactive,  40 0
bind = CTRL SHIFT, k, resizeactive,  0 -40
bind = CTRL SHIFT, j, resizeactive,  0  40

# ── Navigate workspaces (CTRL + arrows) ───────────────────────────────────────
bind = CTRL, left,  workspace, e-1
bind = CTRL, right, workspace, e+1

# ── Ir a workspace: CTRL + 1-8 portátil, CTRL + 9/0/' HDMI ───────────────────
bind = CTRL, 1, workspace, 1
bind = CTRL, 2, workspace, 2
bind = CTRL, 3, workspace, 3
bind = CTRL, 4, workspace, 4
bind = CTRL, 5, workspace, 5
bind = CTRL, 6, workspace, 6
bind = CTRL, 7, workspace, 7
bind = CTRL, 8, workspace, 8
bind = CTRL, 9,          workspace, 9
bind = CTRL, 0,          workspace, 10
bind = CTRL, apostrophe, workspace, 11

# ── Mover ventana a workspace y seguir ────────────────────────────────────────
bind = CTRL SHIFT, 1, movetoworkspace, 1
bind = CTRL SHIFT, 2, movetoworkspace, 2
bind = CTRL SHIFT, 3, movetoworkspace, 3
bind = CTRL SHIFT, 4, movetoworkspace, 4
bind = CTRL SHIFT, 5, movetoworkspace, 5
bind = CTRL SHIFT, 6, movetoworkspace, 6
bind = CTRL SHIFT, 7, movetoworkspace, 7
bind = CTRL SHIFT, 8, movetoworkspace, 8
bind = CTRL SHIFT, 9,          movetoworkspace, 9
bind = CTRL SHIFT, 0,          movetoworkspace, 10
bind = CTRL SHIFT, apostrophe, movetoworkspace, 11

# ── Screenshots ───────────────────────────────────────────────────────────────
bind = , Print,       exec, grim ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png
bind = SHIFT, Print,  exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png
bind = CTRL SHIFT, S, exec, ~/.config/hypr/scripts/screenshot-area.sh

# ── Mouse ─────────────────────────────────────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Volume ────────────────────────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize
    match {
        class = .*
    }
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match {
        class = ^$
        title = ^$
        xwayland = true
        float = true
        fullscreen = false
        pin = false
    }
    no_focus = true
}

windowrule {
    name = vol-slider
    match {
        title = ^(Volumen)$
    }
    float = true
    pin = true
}

windowrule {
    name = brightness-slider
    match {
        title = ^(Brillo)$
    }
    float = true
    pin = true
}

# ── Aria (widget de musica, Ctrl+M) — proyecto externo, no incluido en estos dots ──
