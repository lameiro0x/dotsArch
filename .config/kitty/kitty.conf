# Font
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        13.0

# Padding
window_padding_width 22

# No decorations
hide_window_decorations yes

# Background opacity para que el blur de Hyprland se note
background_opacity 0.92

# Colors base
background #0d0d0d
foreground #c8c8c8

selection_background #2a2a2a
selection_foreground #eeeeee

# Paleta ANSI monocromatica desaturada
# Blues/greens/cyans -> grises frios/calidos
# Red solo para errores
color0  #151515
color1  #a84848
color2  #556655
color3  #776655
color4  #556677
color5  #665566
color6  #556666
color7  #c8c8c8
color8  #444444
color9  #c05858
color10 #778877
color11 #998877
color12 #7788aa
color13 #887788
color14 #778888
color15 #eeeeee

# Cursor
cursor            #f0f0f0
cursor_text_color #0d0d0d
cursor_shape      block

# Blink
cursor_blink_interval      0.6
cursor_stop_blinking_after 15.0

# Cursor trail
cursor_trail                 50
cursor_trail_decay           0.2 0.7
cursor_trail_start_threshold 1
cursor_trail_color           #888888

# Scrollback
scrollback_lines 10000

# Shell integration
shell_integration enabled

# Mouse
mouse_hide_wait 2.0

# Sin bell
enable_audio_bell no

# Tab bar oculta
tab_bar_style hidden

# Clear screen
map super+l send_text all \x0c
